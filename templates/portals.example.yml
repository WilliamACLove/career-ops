    api: https://boards-api.greenhouse.io/v1/boards/axiomlaw/jobs
    notes: "Flexible/interim senior in-house counsel marketplace (18+ yr avg PQE). Probable Greenhouse slug, UNTESTED — posting URLs carry Greenhouse job-ID format; verify before enabling. Fallback careers_url above (axiomlaw.com/careers/lawyers/available-positions) if the Greenhouse board doesn't exist."
    enabled: false

# ── Manual watchlist (no scannable pattern) ───────────────────────────
# These legal sources have no stable site: query, RSS feed, or public API —
# scan.mjs cannot reach them. Check manually on your own cadence; do not
# expect scan-history.tsv or the tracker to dedup these automatically.
#
#   - OSCAR (oscar.uscourts.gov)          — federal clerkships; LOGIN-WALLED, no site: pattern, no feed.
#   - NCSC state-court job postings       — https://www.ncsc.org/resources-courts/state-court-job-postings (page-diff manually)
#     + CORA                              — state-clerkship clearinghouse (entry-level skew, unverified browse)
#   - OPM Attorney Talent Portal          — https://talent.opm.gov/attorney (100+ federal attorney jobs, new 2025-26 portal)
#     + attorney.usajobs.gov              — prebuilt USAJOBS portal scoped to the Attorney series
#   - IAPP Career Central                 — https://iapp.org/community/career-central (privacy counsel/DPO; client-side
#                                            rendered so site: yield is weak — the free monthly Career Central jobs
#                                            newsletter is the real feed)
#   - SCCE/HCCA Job Board                 — my.corporatecompliance.org/s/job-board (Salesforce UI, poor site: yield;
#                                            biweekly email alerts are the feed; $500/90-day postings = employer-serious signal)
#   - InhouseBlog                         — inhouseblog.com/in-house-counsel-jobs/ + /legal-operations-jobs/ (curated;
#                                            see the retest list below for /feed)
#   - LegalOps.com Job Board              — legalops.com/job-board (partial gating: featured public, full list needs
#                                            free membership)
#   - Legal Operations Job Board (Notion) — the-legal-ops-job-board.notion.site/... (community-curated, no RSS,
#                                            check freshness first)
#   - Lawtrades                           — app.lawtrades.com/legal-jobs (project/fractional; invite-only pool, low
#                                            scanner value)
#   - Ontra Legal Network                 — NOT a job board; apply-once freelance network (fund docs, 20hr/wk min,
#                                            1099 contract)
#   - FlexJobs Legal                      — flexjobs.com/remote-jobs/legal — CANDIDATE-PAID FLAG ($23.95/4wk); jobs
#                                            are usually findable free at their origin source — discovery reference
#                                            only, don't recommend paying
#   - TechGC / The L Suite                — jobs.techgc.co + jobs.lsuite.co (GC/CLO community job board; browse
#                                            pages like /jobs/search/Associate-Counsel are publicly indexed but the
#                                            4,500-member network itself is invitation-only — high relevance for
#                                            first-legal-hire and GC roles, treat as a manual check)
#
# Skip / dead (do not add):
#   - Hired.com          — DEAD, shut down May 2024, folded into LHH.
#   - iHireLegal         — FLAG: paid tier, complaints of recycled/stale postings + spam. Exclude.
#   - Symplicity         — law-school career boards, LOGIN-WALLED behind school credentials. Skip.
#   - LawClerk.legal / Hire an Esquire — signup-gated marketplaces, no scannable inventory. Skip.
#   - Underdog.io        — alive (acquired Jan 2026) but signup-gated matching marketplace, tech/business focus,
#                          no legal category. Skip.
#   - Benchmark portfolio board — does not exist (jobs.benchmark.com is dead / squatted names only).

# ── Zero-token feed & API techniques (future providers) ───────────────
# Techniques worth building a provider/parser around later, plus an
# untested-endpoint retest list. None of these are wired up yet — the
# WebSearch site: queries above are the current stopgap.
#
#   - YM Careers saved-search RSS: /jobs/rss/{search-id}/{slug} — proven on
#     careers.fedbar.org/jobs/rss/13812144/content-attorney. Generate the
#     search-id once via each board's job-alert UI, then poll zero-token.
#     Applies to: careers.fedbar.org, careers.aipla.org, careers.aceds.org,
#     careers.napaba.org, careercenter.hnba.com, careercenter.americanhealthlaw.org.
#   - Web-Scribble URL family: /q-{kw}-jobs.html + /browse-jobs — shared by
#     jobline.acc.com, jobs.cloc.org, jobs.nalp.org, careercenter.nacua.org,
#     jobboard.lgbtqbar.org, jobs.nationalbar.org. Stable prebuilt query URLs,
#     good site: targets even without a dedicated provider.
#   - JobPosting JSON-LD harvest: extract <script type="application/ld+json">
#     JobPosting objects (title, datePosted, validThrough, baseSalary) from
#     any Google-for-Jobs-indexed career page, including law firms. This is a
#     parser TECHNIQUE to reuse across tracked_companies, not a source itself.
#   - Adzuna API — GET api.adzuna.com/v1/api/jobs/us/search/1?app_id={id}&app_key={key}&category=legal-jobs&what=attorney
#     Free key at developer.adzuna.com, ~250 calls/day free tier. Best
#     programmatic aggregator candidate; category slug untested — confirm via
#     /v1/api/jobs/us/categories before wiring up a provider.
#   - Jooble API — POST jooble.org/api/{api_key} {"keywords":"attorney"}.
#     Free key at jooble.org/api/about. Second aggregator for cross-check.
#   - Getro board pattern (VC portfolio boards): /jobs?q={kw} search + a
#     standard Legal job-function filter on every board (per Getro's docs);
#     job detail URLs /companies/{co}/jobs/{id}-{slug}. JS-rendered, so plain
#     HTTP GET won't see listings — a Playwright-based provider could. Getro's
#     official Network Data API is paid/partner-gated; the community-reported
#     anonymous endpoint (POST api.getro.com/api/v2/collections/{id}/search/jobs)
#     is UNVERIFIED — do not rely on it.
#   - Consider board pattern (jobs.a16z.com, jobs.sequoiacap.com, jobs.lsvp.com,
#     jobs.greylock.com, jobs.firstround.com): /jobs + /companies indexes,
#     /jobs/{company-slug} pages. Community-reported internal API
#     (POST {board}/api-boards/search-jobs) is UNVERIFIED/untested.
#   - VC-portfolio ATS seed sweep (works TODAY, zero-token): `node
#     scan-ats-full.mjs --seeds yc,a16z` pulls the public YC/a16z portfolio
#     company lists and probes each company's own ATS board through this
#     file's title_filter — no new provider needed. See seeds/README.md.
#
# Untested-endpoint retest list (run once from an unblocked network):
#   naag.org/job/feed/, blog.psjd.org/feed, paragonlegal.com/jobs/feed/,
#   inhouseblog.com/feed, jobslegaloperators.com/feed/,
#   boards-api.greenhouse.io/v1/boards/axiomlaw/jobs (the Axiom Greenhouse
#   slug above), YM Careers /jobs/rss/ saved-search URLs, Adzuna
#   /v1/api/jobs/us/categories (confirm the legal-jobs slug), Getro/Consider
#   JSON endpoints noted above.

# ── Job Boards ────────────────────────────────────────────────────────
# Multi-employer aggregators. Unlike tracked_companies (one entry = one employer),
# job boards return offers from many companies in a single API call.
# Same title/location filtering and dedup apply.

job_boards:

  # ── Startup aggregators (native providers, zero-token) ──────────────
  # Both confirmed to carry counsel/legal inventory — the title_filter above
  # does the narrowing.

  - name: EchoJobs
    provider: echojobs
    max_pages: 3
    enabled: true
    notes: "Aggregates from company ATS boards; confirmed NOT engineering-only — counsel roles observed (Databricks Senior Legal Counsel, Serve Robotics GC, Tubi AGC Privacy, DuckDuckGo Legal Counsel). Some non-startup employers mixed in."

  - name: Himalayas
    provider: himalayas
    enabled: true
    notes: "Remote-global board with a dedicated legal category (himalayas.app/jobs/legal); active counsel inventory observed. Skews remote-worldwide — pair with location_filter if you need US-only."

  # ── SolidJobs (Polish market) ──────────────────────────────────────
  # Public API — no auth needed. Division in URL path, campaign=career-ops for tracking.
  # Available divisions: it, engineering, marketing, sales, hr, logistics, finances, other

  - name: SolidJobs IT
    careers_url: https://solid.jobs/public-api/offers/it?campaign=career-ops
    provider: solidjobs
    enabled: false
    notes: "Polish IT job board — IT division. Tech-only; carries little legal inventory for an attorney search. The 'other' division below may occasionally surface in-house legal roles for the Polish market."

  - name: SolidJobs Engineering
    careers_url: https://solid.jobs/public-api/offers/engineering?campaign=career-ops
    provider: solidjobs
    enabled: false
    notes: "Polish job board — Engineering & Production division"

  - name: SolidJobs Marketing
    careers_url: https://solid.jobs/public-api/offers/marketing?campaign=career-ops
    provider: solidjobs
    enabled: false
    notes: "Polish job board — Marketing division"

  - name: SolidJobs Sales
    careers_url: https://solid.jobs/public-api/offers/sales?campaign=career-ops
    provider: solidjobs
    enabled: false
    notes: "Polish job board — Sales division"

  - name: SolidJobs HR
    careers_url: https://solid.jobs/public-api/offers/hr?campaign=career-ops
    provider: solidjobs
    enabled: false
    notes: "Polish job board — HR division"

  - name: SolidJobs Logistics
    careers_url: https://solid.jobs/public-api/offers/logistics?campaign=career-ops
    provider: solidjobs
    enabled: false
    notes: "Polish job board — Logistics division"

  - name: SolidJobs Finances
    careers_url: https://solid.jobs/public-api/offers/finances?campaign=career-ops
    provider: solidjobs
    enabled: false
    notes: "Polish job board — Finances division"

  - name: SolidJobs Other
    careers_url: https://solid.jobs/public-api/offers/other?campaign=career-ops
    provider: solidjobs
    enabled: false
    notes: "Polish job board — Other specialists division"

  # ── JustJoin.it / NoFluffJobs (Polish tech market) ────────────────────────
  # Public job-board APIs. Disabled by default; enable and rely on the global
  # title_filter/location_filter/salary_filter above for your target profile.

  - name: JustJoin.it
    careers_url: https://justjoin.it/job-offers/all-locations
    provider: justjoin
    enabled: false
    notes: "Polish tech job board — newest public offers. Tech-focused; little legal inventory. Generic boards like this one can still be enabled if you also work Polish in-house legal roles, but expect low yield."

  - name: NoFluffJobs
    careers_url: https://nofluffjobs.com/pl
    provider: nofluffjobs
    enabled: false
    notes: "Polish tech job board — newest public postings. Tech-focused; little legal inventory."

  # -- Indonesia job boards (provider: jobstreet / glints) --
  # Generic multi-industry aggregators, not tech-only — but the example
  # searchKeywords below still target legal roles to match this template's
  # focus. Adjust countryCode/siteKey/searchLocation for your jurisdiction.

  - name: Jobstreet Indonesia
    provider: jobstreet
    api: https://id.jobstreet.com/api/jobsearch/v5/search
    siteKey: ID-Main
    searchKeywords: "legal counsel"
    searchLocation: "Jakarta"
    pageSize: 30
    maxPages: 3
    enabled: false
    notes: "Indonesia's largest job board (SEEK group). Uses SEEK v5 JobSearch API — zero tokens."

  - name: Glints Indonesia
    provider: glints
    api: https://glints.com/api/v2-alc/graphql       # searchJobsV3 endpoint
    searchKeywords: "legal counsel"
    countryCode: ID
    pageSize: 30
    maxPages: 3
    enabled: false
    notes: "SEA job platform covering ID/SG/MY/VN. Uses searchJobsV3 GraphQL endpoint (v2-alc). WAF blocks non-browser requests — works best from Playwright context."

  # ── HigherEdJobs (university / higher-ed RSS) ────────────────────────
