# -- Company aliases (optional) --
# Map alternate company names to a single canonical label so the scanner's
# company+role dedup matches your tracker. The scanner keys dedup on the name a
# provider returns — usually the ATS org (e.g. Workday "kCura") — which may
# differ from the brand you track (e.g. "Relativity", the eDiscovery
# platform's current name). Without an alias, the same role is re-scanned and
# re-evaluated every run because "kcura::role" never matches
# "relativity::role" in data/applications.md.
#
# Format: `CanonicalName: [alias, ...]`. Every alias AND the canonical name
# resolve to the canonical label (case-insensitive). Companies with no entry are
# unaffected. Combined with title normalization, this suppresses URL-new
# duplicates caused by requisition URL changes and per-location title splits
# ("Counsel (Berlin)" vs "Counsel"). It does not classify repost patterns or
# produce `postingChurn` evidence; detect-reposts.mjs and company-history.mjs own
# that post-tracking layer.
#
# company_aliases:
#   Relativity: [kCura]

tracked_companies:

  # In-house legal teams typically post only 0-5 openings at a time, so
  # breadth of companies matters more than depth for this scanner. Large
  # law firms (AmLaw/BigLaw) run legal-vertical ATSs (viRecruit/"vi by
  # Aderant", LawCruit/Litera, Flo Recruit) with no public JSON APIs — firm
  # lateral roles come via recruiters and aggregators (LawCrossing,
  # LateralHub, Leopard Solutions/SurePoint), not this scanner. See the
  # legal-board site: queries in search_queries above for firm-lateral
  # coverage instead.

