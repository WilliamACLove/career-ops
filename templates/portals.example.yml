# Portal Scanner Configuration
# Used by /career-ops scan to discover new offers automatically.
#
# Strategy (4 levels):
#   0. Local parser → per-company `parser:` script for SSR/static career pages (zero-token)
#   1. Playwright → careers_url of each company (real-time, reliable)
#   2. HTTP JSON (WebFetch) → per-company `api:` on tracked_companies (see board_api_catalog below)
#   3. WebSearch with site: filters (broad discovery, may be stale)
#
# IMPORTANT: Each company in tracked_companies MUST have careers_url.
#   Prefer the BRANDED company careers URL whenever available; use ATS-hosted URL only as fallback.
#   ✅ https://careers.mastercard.com   ⚠️ https://mastercard.wd1.myworkdayjobs.com (fallback only)
#   ✅ https://openai.com/careers       ⚠️ https://job-boards.greenhouse.io/openai (fallback only)
#   Exception: ATS-hosted careers_url is acceptable when no branded careers page exists.
#   Using raw ATS URLs when a branded page exists can cause false 410 errors (job ID mismatch).
#
# HOW TO CUSTOMIZE:
#   1. Copy this file to portals.yml in the project root
#   2. Edit title_filter.positive with YOUR target practice-area keywords
#      (e.g. Counsel, Attorney, Litigation, Compliance Counsel)
#   3. Add/remove companies in tracked_companies
#   4. Adjust search_queries for your preferred legal job boards
#   5. Set enabled: false on companies you don't care about

# -- Scan history recheck policy (optional) --
# By default, URLs recorded in data/scan-history.tsv are deduped forever.
# Set recheck_after_days to let previously added URLs become eligible again
# after N days, useful for roles that reopen or are republished at the same URL.
# Permanent invalid statuses such as blocked host or malformed URL still remain
# deduped forever.
#
# scan_history:
#   recheck_after_days: 30

# -- Location filter (optional) --
# Filter scanned jobs by location. Applied AFTER title filter, BEFORE dedup.
# If this entire block is absent, all locations pass (current default behavior).
#
# Semantics (case-insensitive substring, in this order):
#   - Empty location string on a job → pass (don't penalize missing data)
#   - Any `always_allow` keyword present → pass (takes precedence over `block`)
#   - Any `block` keyword present → reject
#   - `allow` empty → pass (already cleared block)
#   - `allow` non-empty → must match at least one keyword
#
# `always_allow` is optional. It rescues multi-location postings that name your
# home region: with always_allow ["New York"] and block ["India"], a job listed
# "Remote, New York or India" passes (New York wins), while "Remote, India" is
# still rejected. Omit always_allow entirely and the filter behaves as before.
#
# Example below targets US-based remote + a couple of US metros, blocking
# common foreign hubs. Customize to your geography.

# location_filter:
#   # always_allow is checked BEFORE block — keep this list to your home region only
#   always_allow:
#     - "United States"   # (replace with your home region)
#     - "New York"
#   allow:
#     - "Remote"
#     - "United States"
#     - "USA"
#     - "Atlanta"
#     - "New York"
#   block:
#     - "India"
#     - "Bengaluru"
#     - "United Kingdom"
#     - "London"
#     - "Germany"
#     - "France"
#     - "Singapore"
#     - "Japan"
#     - "Brazil"
#     - "Australia"

# -- Salary filter (optional) --
# Filter scanned jobs by annual compensation range. Applied AFTER location
# filter, BEFORE dedup. Only applies when structured salary data exists.
#
# Semantics:
#   - min/max are annual compensation filters (use annualized values)
#   - max: 0 means "no upper limit"
#   - If no salary data exists on a job, it passes (conservative behavior)
#   - If both currencies are known and differ, the job is rejected by the salary filter
#   - Partial ranges (min only or max only) work correctly
#   - If this entire block is absent, salary is not filtered (default behavior)
#
# Example: target roles paying at least $100k, no upper limit
# salary_filter:
#   min: 100000
#   max: 0
#   currency: "USD"

# -- Posting-age filter (optional) --
# Opt-in freshness gate. Skips offers whose posting date (postedAt, supplied by
# the provider) is older than N days. Offers from providers that expose no date
# are never skipped — same "don't penalize missing data" rule as location_filter.
# Absent, 0, or non-positive → disabled (all ages pass).
#
# max_posting_age_days: 45

# -- Trust filter (optional) --
# Enriches each scanned job with a trust score (0-100) and flags.
# Jobs are NEVER dropped — only annotated. The trust score helps you
# prioritize which postings to evaluate first.
#
# Heuristics (V1):
#   1. URL structure validation (malformed or non-http URLs)
#   2. Missing application URL
#   3. Suspicious domain detection (link shorteners, form builders)
#   4. Company ↔ domain mismatch (with ATS allowlist)
#
# If this block is absent or enabled: false, all jobs get score 100.
#
# trust_filter:
#   enabled: true
#   suspicious_domains:
#     - "bit.ly"
#     - "tinyurl.com"
#     - "t.co"
#     - "forms.gle"
#     - "goo.gl"
#     - "shorturl.at"
#   # Override the built-in ATS allowlist (greenhouse, lever, workday, etc.).
#   # URLs hosted on these domains skip the company↔domain mismatch check.
#   # ats_allowlist:
#   #   - "greenhouse.io"
#   #   - "ashbyhq.com"
#   #   - "lever.co"
#   #   - "custom-ats.example.com"

# -- Content filter (optional) --
# Filters on the job DESCRIPTION text, not just the title — useful when
# companies post generic titles ("Software Engineer") with very different
# stacks. Case-insensitive substring match.
# Semantics:
#   - A job with no description always passes (see provider support below)
#   - Any `negative` keyword present → reject
#   - `positive` empty → pass (after clearing negatives)
#   - `positive` non-empty → at least one keyword must be present
#   - If this entire block is absent, descriptions are not filtered (default)
#
# Provider support: the scanner is zero-token and only reads descriptions that
# a provider already returns in its list payload — it never fetches each job
# page. Currently Lever (`descriptionPlain`) supplies descriptions; jobs from
# providers that don't always pass this filter (they're never silently dropped).
#
# Example: keep roles that require bar admission / a J.D., drop pure
# document-review shops
# content_filter:
#   positive:
#     - "bar admission"
#     - "J.D."
#   negative:
#     - "document review"
#
# by_title_keyword (optional): scope a stricter positive/negative pair to only
# the jobs matched via a specific title_filter.positive keyword, instead of
# applying it to every scanned job. Useful when a title keyword is broad
# enough to need extra confirmation from the description (e.g. "Counsel"
# alone doesn't distinguish an attorney role from a genetic/admissions/camp
# counselor, so require the JD to actually confirm a legal-context token)
# without that same requirement leaking onto unrelated categories (Contracts
# Manager, Compliance Officer, ...). Jobs matched via a keyword with no entry
# here fall back to the global positive/negative pair above.
# content_filter:
#   by_title_keyword:
#     "Counsel":
#       positive:
#         - "bar admission"
#         - "J.D."
#         - "esquire"

# -- Title filter --
# The scanner uses these keywords to decide if a title is relevant.
# At least 1 positive must match AND 0 negatives must match (case-insensitive).
#
# skip_tiers: [intern, entry]  # optional: skip listings by seniority tier (note: unrecognized/plain titles fall back to 'mid')

title_filter:
  positive:
    # [CUSTOMIZE] Add keywords matching YOUR target legal roles
    # -- Core legal / attorney roles --
    - "Counsel"
    - "Attorney"
    - "Lawyer"
    - "General Counsel"
    - "Head of Legal"
    - "Legal Director"
    - "Director of Legal"
    - "Chief Legal Officer"
    - "Compliance Counsel"
    - "Compliance Officer"
    - "Head of Compliance"
    - "Contracts Manager"
    - "Contracts Negotiator"
    - "Litigation Associate"
    - "Legal Engineer"
    # -- Optional additions (uncomment if in scope for you) --
    # NOTE: enabling "Paralegal" also means removing it from the negative
    # list below, where it's excluded by default for attorney-only searches.
    # - "Legal Operations"
    # - "Paralegal"
    # - "Privacy Officer"
    # - "DPO"
    # -- German legal keywords (DACH market) — example for DACH users;
    # uncomment/adapt if you're targeting in-house or Syndikusanwalt roles --
    # - "Syndikusrechtsanwalt"
    # - "Justiziar"
    # - "Volljurist"
    # - "Legal Counsel (DACH)"
  negative:
    # [CUSTOMIZE] Add keywords for roles you want to exclude
    # The scanner does case-insensitive SUBSTRING matching, so "Counsel"
    # also matches "Counselor"/"Counseling" (genetic counselor, admissions
    # counselor, camp counselor, mental-health counselor — common at
    # healthtech/edtech companies). Hence the negatives below.
    - "Counselor"
    - "Counseling"
    - "Paralegal"          # remove this line if paralegal roles are in scope
    - "Legal Assistant"
    - "Legal Secretary"
    - "Legal Intern"
    - "Recruiter"
    - "Legal Recruiting"
    - "Account Executive"
    - "Sales"
    - "Trade Compliance"
    - "Export Compliance"
    - "Compliance Engineer"
    - "Contracts Specialist"
    - "Contracts Administrator"
    - "Junior"
    - "Intern"
  seniority_boost:
    # These prefixes add relevance but are not required
    - "Senior"
    - "Lead"
    - "Head"
    - "Director"
    - "Deputy"
    - "Chief"
    - "Associate General Counsel"
    - "Assistant General Counsel"

# -- Search queries --
# Each query triggers a WebSearch. Use site: to filter by portal.
# The scanner extracts title, URL, and company from results.

search_queries:
  # -- Ashby --
  - name: Ashby — Counsel roles
    query: 'site:jobs.ashbyhq.com "Counsel" OR "General Counsel" OR "Legal Counsel" remote'
    enabled: true

  - name: Ashby — Attorney & Litigation
    query: 'site:jobs.ashbyhq.com "Attorney" OR "Litigation Counsel" OR "Senior Counsel" remote'
    enabled: true

  - name: Ashby — Legal Engineer
    query: 'site:jobs.ashbyhq.com "Legal Engineer" OR "Applied Legal Researcher" remote'
    enabled: true

  - name: Ashby — Compliance
    query: 'site:jobs.ashbyhq.com "Compliance Counsel" OR "Compliance Officer" OR "Head of Compliance" remote'
    enabled: true

  # -- Greenhouse --
  - name: Greenhouse — Counsel roles
    query: 'site:boards.greenhouse.io OR site:job-boards.greenhouse.io "Counsel" OR "General Counsel" OR "Legal Counsel" remote'
    enabled: true

  - name: Greenhouse — Attorney & Litigation
    query: 'site:boards.greenhouse.io OR site:job-boards.greenhouse.io "Attorney" OR "Litigation Counsel" OR "Senior Counsel" remote'
    enabled: true

  - name: Greenhouse — Contracts
    query: 'site:boards.greenhouse.io OR site:job-boards.greenhouse.io "Contracts Manager" OR "Contracts Negotiator" remote'
    enabled: true

  # -- Lever --
  - name: Lever — Counsel roles
    query: 'site:jobs.lever.co "Counsel" OR "General Counsel" OR "Legal Counsel" remote'
    enabled: true

  # -- Workable --
  - name: Workable — Legal roles
    query: 'site:apply.workable.com "Counsel" OR "Attorney" OR "Compliance Officer" remote'
    enabled: true

  # -- In-house legal aggregators --
  # legal.io and legalalphabet.com aggregate per-company legal openings at
  # tech/fintech companies (legal.io/organizations/{id}/{Company}); useful for
  # discovering in-house counsel roles beyond the tracked_companies list below.

  - name: GoInhouse — In-house counsel board
    query: 'site:goinhouse.com "Counsel" OR "General Counsel" remote'
    enabled: true

  - name: Lawjobs.com — ALM/Law.com
    query: 'site:lawjobs.com "Counsel" OR "Attorney" remote'
    enabled: true

  - name: LawCrossing — Attorney aggregator
    query: 'site:lawcrossing.com "Attorney" OR "Counsel" remote'
    enabled: true

  - name: LateralHub — Firm lateral openings
    query: 'site:lateralhub.com "Associate" OR "Partner" OR "Counsel"'
    enabled: true

  - name: legal.io — Tech-company legal roles
    query: 'site:legal.io/organizations "Counsel" OR "Legal"'
    enabled: true

  - name: LegalAlphabet — Tech-company legal roles
    query: 'site:legalalphabet.com "Counsel" OR "Legal"'
    enabled: true

  # -- Government (the one channel with a real API) --
  # developer.usajobs.gov offers a free REST API (email-registered
  # Authorization-Key + User-Agent headers) — Position Series 0905 is
  # Attorney. This WebSearch query is a stopgap; a future `provider:
  # usajobs` could hit the API directly, zero-token.
  - name: USAJOBS — Attorney (Series 0905)
    query: 'site:usajobs.gov "attorney" full-time'
    enabled: true

  # DOJ experienced-attorney openings (AUSA etc.) are posted at
  # justice.gov/usao/career-center/job-openings/attorneys, not USAJOBS. The
  # DOJ Honors Program does NOT use USAJOBS either — it hires through the
  # Avue Digital Services portal via justice.gov/legal-careers (attorney
  # hiring is excepted service).
  - name: DOJ — Attorney & AUSA openings
    query: 'site:justice.gov "attorney" OR "AUSA" career-center'
    enabled: true

  # -- Bar associations --
  # Nearly all state bar career centers (jobs.nysba.org, jobs.wsba.org,
  # jobs.inbar.org, jobs.osbar.org, jobs.montanabar.org, ...) are white-label
  # YM Careers boards — one scraper pattern would cover dozens of them.
  - name: ABA Career Center
    query: 'site:jobs.americanbar.org "Counsel" OR "Attorney"'
    enabled: true

  - name: NYSBA Career Center
    query: 'site:jobs.nysba.org "Counsel" OR "Attorney"'
    enabled: true

  # -- Government / public sector --
  - name: NAAG Job Center — state Attorneys General
    query: 'site:naag.org/job attorney'
    notes: "AAG/Deputy AG roles across state AG offices, salaries listed. Best single AG aggregator. naag.org/job/feed/ is a probable RSS endpoint — untested, see the retest list below."
    enabled: true

  - name: NDAA Career Center — prosecutors
    query: 'site:ndaa.org/job (prosecutor OR attorney)'
    notes: "ADA/DDA/prosecutor roles nationwide. Annual DC prosecutor job fair (late Jan)."
    enabled: true

  - name: NLADA Job Board — public defenders / legal aid
    query: 'site:nlada.org jobposting ("staff attorney" OR "public defender")'
    notes: "Public defender + civil legal-aid roles, salaries listed; stable /jobposting/{id} URLs."
    enabled: true

  - name: GovernmentJobs.com (NEOGOV) — county/city/state attorney
    query: 'site:governmentjobs.com attorney ("county attorney" OR "city attorney" OR "assistant attorney general")'
    notes: "High-volume state/county/city attorney reqs. TOS PROHIBITS scraping their JSON endpoints — site: query only, never hit the API directly."
    enabled: true

  - name: PSJD (NALP) — public interest + government
    query: 'site:psjd.org opportunitydetails attorney'
    notes: "Public interest + government jobs, fellowships. PARTIAL PAYWALL: full descriptions are free only for subscriber-school students/alumni. Index carries stale OppIDs — filter for recency."
    enabled: true

  # -- Bar associations & practice-area boards --
  - name: ACC Jobline — in-house association board
    query: 'site:jobline.acc.com "general counsel" OR counsel'
    enabled: true

  - name: AIPLA Career Center — IP/patent
    query: 'site:careers.aipla.org attorney'
    notes: "Patent prosecution/litigation, in-house IP. YM Careers board — RSS candidate, see the zero-token feed techniques below."
    enabled: false  # enable if targeting IP/patent practice

  - name: INTA Career Center — trademark
    query: 'site:career.inta.org trademark'
    enabled: false  # enable if targeting trademark practice

  - name: ACEDS Career Center — eDiscovery
    query: 'site:careers.aceds.org (attorney OR ediscovery)'
    notes: "eDiscovery attorney/PM roles. YM Careers board — RSS candidate."
    enabled: false  # enable if targeting eDiscovery/litigation-support practice

  - name: Federal Bar Association Career Center
    query: 'site:careers.fedbar.org attorney'
    notes: "YM Careers board — the proven RSS proof-case (see the zero-token feed techniques below)."
    enabled: true

  - name: AHLA Career Center — health law
    query: 'site:careercenter.americanhealthlaw.org (attorney OR counsel)'
    enabled: false  # enable if targeting health law

  - name: Affinity bars — NBA / HNBA / NAPABA / LGBTQ+ Bar
    query: 'site:jobs.nationalbar.org OR site:careercenter.hnba.com OR site:careers.napaba.org OR site:jobboard.lgbtqbar.org attorney'
    notes: "One combined query covers NBA/HNBA/NAPABA/LGBTQ+ Bar. Employers posting here signal diversity commitment."
    enabled: true

  - name: Association Career Network sweep
    query: 'site:associationcareernetwork.com attorney'
    notes: "White-label bar-association network (Texas Bar, Florida Bar, Fairfax Bar, AHLA JobFlash, etc.) in one query."
    enabled: true

  - name: NALP Job Center
    query: 'site:jobs.nalp.org (attorney OR recruiting)'
    notes: "MOSTLY legal recruiting/professional-development STAFF roles, not practice roles. Low priority — disabled by default."
    enabled: false

  # -- Academic / university counsel --
  - name: NACUA Career Center — higher-ed in-house
    query: 'site:careercenter.nacua.org counsel'
    notes: "Higher-ed in-house counsel/GC roles; open to non-members. Web-Scribble board."
    enabled: false  # enable if targeting university/higher-ed in-house counsel

  - name: HigherEdJobs — Legal Affairs
    query: 'site:higheredjobs.com "general counsel" OR "university counsel"'
    notes: "GC/AGC roles with salaries ($200-330k seen). Free, no login; bot-blocks direct fetch, so site: query only. See also the commented higheredjobs RSS entry under job_boards below (category 68 = Higher Education) as a zero-token complement."
    enabled: false  # enable if targeting university/higher-ed in-house counsel

  # -- Startup & tech in-house --
  - name: Built In — tech in-house counsel
    query: 'site:builtin.com/job "counsel"'
    notes: "Tech in-house counsel roles (Airbnb, Groq, Dell observed). City sites consolidated under builtin.com; numeric job IDs for dedup."
    enabled: true

  - name: Welcome to the Jungle — startup/tech legal counsel
    query: 'site:app.welcometothejungle.com/jobs "legal counsel"'
    notes: "Startup/tech in-house counsel; skews UK/EU. Works without an account."
    enabled: true

  - name: YC Work at a Startup — first legal hire
    query: 'site:workatastartup.com (counsel OR "head of legal")'
    notes: "Thin inventory — occasional first-legal-hire roles (e.g. Clipboard Health counsel observed). Scan monthly, not daily."
    enabled: true

  - name: Wellfound — startup GC/counsel
    query: 'site:wellfound.com/jobs ("general counsel" OR "legal counsel")'
    notes: "FLAG: browse UI is login-gated and indexed postings are frequently STALE — always liveness-check before adding a hit to the tracker."
    enabled: false  # disabled by default — see stale-posting flag above

  # -- VC portfolio job boards --
  # Each board aggregates openings across a VC firm's whole portfolio (hundreds
  # of startups per board) — a rich in-house-counsel source. Two platforms
  # dominate: Getro (jobs.accel.com, jobs.generalcatalyst.com — ships a Legal
  # job-function filter) and Consider (jobs.a16z.com, jobs.sequoiacap.com,
  # jobs.lsvp.com). Both render client-side, so site: queries are the reliable
  # scan mechanism (their JSON endpoints are untested — see the techniques
  # block below). Related zero-token path: `node scan-ats-full.mjs --seeds
  # yc,a16z` probes YC/a16z portfolio companies' OWN ATS boards directly with
  # this file's title_filter — see seeds/README.md.

  - name: Accel portfolio — counsel
    query: 'site:jobs.accel.com counsel'
    notes: "Richest counsel inventory of the VC boards checked: GC, AGC Compliance, Senior Legal Counsel, Product Counsel roles observed across portfolio (Scale AI, Webflow, Anthropic, Dropbox). Getro platform."
    enabled: true

  - name: Index Ventures — legal function
    query: 'site:indexventures.com/startup-jobs (counsel OR legal)'
    notes: "Dedicated legal-function page (indexventures.com/startup-jobs/legal/ — 273 legal jobs observed: Discord, DeepL, Revolut). Custom platform on the main site, not a jobs.* subdomain."
    enabled: true

  - name: Bessemer portfolio — counsel
    query: 'site:jobs.bvp.com counsel'
    notes: "Counsel roles observed (Deputy GC at ServiceTitan). Legacy jobdetail.php URL scheme — different scraper selectors than Getro/Consider."
    enabled: true

  - name: a16z portfolio — counsel
    query: 'site:jobs.a16z.com "counsel"'
    notes: "Large Consider-platform board. NOISE WARNING: portfolio company 'Counsel Health' matches the keyword — filter hits by title. Sibling portfoliojobs.a16z.com is a redundant legacy board — skip it."
    enabled: true

  - name: Sequoia portfolio — counsel
    query: 'site:jobs.sequoiacap.com ("legal counsel" OR counsel)'
    notes: "Consider platform. Counsel inventory unconfirmed at last check — kept for breadth (large portfolio incl. Harvey, Finch)."
    enabled: true

  - name: General Catalyst portfolio — counsel
    query: 'site:jobs.generalcatalyst.com counsel'
    notes: "Getro platform, 800+ portfolio companies, Legal job-function filter available on the board UI."
    enabled: true

  - name: Lightspeed portfolio — counsel
    query: 'site:jobs.lsvp.com counsel'
    notes: "Consider platform. Counsel inventory unconfirmed — portfolio includes Carta, Glean, Helsing."
    enabled: true

  - name: VC portfolio boards — second tier
    query: 'site:jobs.khoslaventures.com OR site:jobs.craftventures.com OR site:jobs.greylock.com OR site:jobs.firstround.com counsel'
    notes: "Khosla + Craft (Getro) and Greylock + First Round (Consider) in one query. Smaller portfolios, counsel inventory unconfirmed — enable for maximum breadth. Kleiner Perkins (jobs.kleinerperkins.com) is mid-platform-migration with mixed URL schemes; add it once it settles. Benchmark has NO portfolio job board (jobs.benchmark.com is dead — do not add)."
    enabled: false

  - name: Startup.jobs — legal counsel
    query: 'site:startup.jobs (counsel OR "legal counsel")'
    notes: "Startup-only aggregator with live legal inventory (startup.jobs/legal-jobs and /roles/legal-counsel both active). JS site — site: query is the mechanism."
    enabled: true

  - name: TopStartups.io — legal
    query: 'site:topstartups.io legal'
    notes: "Startup-only board with a Legal role filter (topstartups.io/jobs/?role=Legal — 'Funded by Sequoia, YC, A16Z'). JS-rendered; search-index yield unverified — check the filter URL manually if the query returns nothing."
    enabled: false

  # -- Flexible / interim / return-to-work --
  - name: The Mom Project — legal/counsel projects
    query: 'site:themomproject.com/projects (counsel OR attorney)'
    notes: "Surprisingly rich legal inventory: Legal Counsel, Product Counsel, IP Attorney, Risk & Compliance Counsel observed. FT/PT/remote/return-to-work; stable /projects/{slug}-{hash} URLs."
    enabled: true

  - name: Paragon Legal — interim in-house counsel
    query: 'site:paragonlegal.com/jobs'
    notes: "Interim in-house (commercial/tech transactions, privacy, product counsel). paragonlegal.com/jobs/feed/ is a probable RSS endpoint — untested, see the retest list below."
    enabled: true

  - name: Latitude Legal — flexible/contract counsel
    query: 'site:latitudelegal.com/jobs'
    notes: "Flexible contract + permanent roles for ex-BigLaw attorneys. Embedded ATS — inspect once for a JSON endpoint."
    enabled: true

  # -- Legal ops --
  - name: Legal Operators Job Board
    query: 'site:legaloperators.com/jobs'
    notes: "Legal ops manager/director, legal knowledge/tech roles. Board is public though the community is paid. Sister site jobslegaloperators.com — try /feed/ RSS (untested, see the retest list below)."
    enabled: true

  - name: Legal.io — Legal Operations persona
    query: 'site:legal.io/jobs "legal operations"'
    notes: "Extra scan target on the existing legal.io source above, scoped to the Legal-Operations persona (legal.io/jobs/persona/Legal-Operations)."
    enabled: true

  - name: CLOC Job Board
    query: 'site:jobs.cloc.org "legal operations"'
    enabled: true

  # -- Legal media boards --
  - name: Law360 Jobs
    query: 'site:jobs.law360.com attorney'
    notes: "Firm associate/counsel roles (LexisNexis network). Likely shares inventory with lawjobs.com above — dedup."
    enabled: true

  - name: Above the Law Job Board
    query: 'site:abovethelaw.com/jobs'
    notes: "Curated, employer-paid ($200/45-day) postings — low volume, decent quality."
    enabled: true

  # -- Other jurisdictions (disabled by default; enable + adapt keywords for
  # your target market) --

  - name: UK — TotallyLegal
    query: 'site:totallylegal.com "Solicitor" OR "In-house Counsel" remote'
    enabled: false

  # career-ops ships DACH/French/Arabic/Japanese/Turkish/Hindi legal-market
  # modes under modes/<lang>/ (see AGENTS.md) but does not pre-populate
  # non-English legal job-board queries here. Add site: queries for your
  # target jurisdiction's bar-association or legal job board following the
  # pattern above and set enabled: true.

# -- Tracked companies --
# Companies whose career pages are checked directly.
# scan_method: playwright (default), websearch, local_parser
# For Greenhouse companies, add api: field for faster structured JSON access.
#
# Provider routing (scan.mjs):
#   By default each entry is auto-detected from `careers_url` against the
#   loaded providers in providers/*.mjs (local-parser, ashby, greenhouse, lever).
#   local-parser runs first when parser.command + parser.script are set.
#
#   Optional fields on a tracked_companies entry:
#     provider: <id>     — force a specific provider, skipping detect().
#     transport: http    — reserved for future transports. Defaults to http.
#
# For SSR/static career pages, add parser.command + parser.script. The command
# can be python3, node, or another local executable. The script must print JSON
# jobs to stdout: [{ "title": "...", "url": "...", "location": "..." }]
#
# Generic local parser examples. Most parser scripts are company-specific and
# already know their target careers URL. `args` are optional and can help the
# parser author (reuse across companies, debug flags, JSON snapshots, etc.).
#
